# cargo-deny configuration.
# See plan/09-dependencies.md §5 for the policy rationale.

[graph]
all-features = true

[advisories]
version = 2
ignore = []

[bans]
multiple-versions = "allow"
wildcards = "deny"
highlight = "all"
deny = [
    # GPL-family licences are incompatible with the project's Apache-2.0 licence.
    { name = "GPL-2.0" },
    { name = "GPL-3.0" },
    { name = "AGPL-3.0" },
    # Unmaintained / deprecated crates.
    { name = "serde_yaml" },
    { name = "trust-dns-server" },
    { name = "trust-dns-proto" },
]
skip-tree = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    # Public-domain dedications. `notify` uses this for its test data.
    "CC0-1.0",
]
confidence-threshold = 0.93
exceptions = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
