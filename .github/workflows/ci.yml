name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check the formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Check the licences and advisories
        run: cargo deny check
      - name: Check the dependency manifest
        run: ./scripts/check-manifest.sh
      - name: Check that the design spec is up to date
        run: |
          ./scripts/build-design-spec.sh
          if ! git diff --quiet -- plan/DESIGN_SPEC.md; then
            echo "error: plan/DESIGN_SPEC.md is stale — run 'make design-spec'" >&2
            git diff -- plan/DESIGN_SPEC.md | head -50
            exit 1
          fi

  unit:
    name: Unit tests (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: ['stable', '1.99']
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --lib

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --tests

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --release
      - name: Build the documentation
        run: cargo doc --workspace --no-deps

  gui:
    name: GUI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: orchestrator-gui/package-lock.json
      - run: npm ci --prefix orchestrator-gui --no-audit --no-fund
      - run: npm run lint --prefix orchestrator-gui
      - run: npm run typecheck --prefix orchestrator-gui
      - run: npm run test --prefix orchestrator-gui
      - run: npm run build --prefix orchestrator-gui

  system:
    name: System tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install the networking tools
        run: sudo apt-get update && sudo apt-get install -y iproute2
      - name: Run the system tests
        # `sudo` resets PATH, which loses the rustup shim directory. Preserve it.
        run: sudo --preserve-env=PATH,HOME ./system-tests/run.sh

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info --ignore-filename-regex '(tests/|/examples/)'
      - uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          # Reporting only. The coverage *threshold* is the gate, and it is enforced by the
          # next step — a codecov outage must not block a merge.
          fail_ci_if_error: false
      - name: Enforce the coverage thresholds
        run: ./scripts/check-coverage.sh

  cross:
    name: Cross-compile
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      # The toolchain must match rust-toolchain.toml. The repository's toolchain file
      # overrides whatever the action installs, so adding the target to a different
      # toolchain leaves the target's standard library missing.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install the cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --workspace --release --target ${{ matrix.target }}
