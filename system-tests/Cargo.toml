[package]
name = "orchestrator-system-tests"
description = "Privileged Linux system tests for Orchestrator: VIP failover and tenant isolation"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

[dependencies]
orchestrator-core = { path = "../crates/orchestrator-core" }
orchestrator-testkit = { path = "../crates/orchestrator-testkit" }

tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "process", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
serde-saphyr = "2.1"
tempfile = "3.27"
