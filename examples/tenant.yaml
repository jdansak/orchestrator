# Orchestrator — example tenant configuration
#
# This file is the canonical example. It is validated by the test suite, so it cannot drift
# away from the schema in plan/07-config-schema.md.
#
# Validate it with:
#   cargo run -p orchestrator -- --config examples/tenant.yaml --check

version: 1

tenant:
  name: app-frontend
  zone: app-frontend.internal
  description: "Public frontend for the app"

# ---------------------------------------------------------------------------
# Virtual IP
# ---------------------------------------------------------------------------
vip:
  address: 10.0.0.100/32
  interface: eth0

# ---------------------------------------------------------------------------
# Listeners
# ---------------------------------------------------------------------------
listeners:
  http:
    bind: 0.0.0.0:8080
  https:
    bind: 0.0.0.0:8443
    tls:
      cert: /etc/orchestrator/tenants/app-frontend/ssl/fullchain.pem
      key: /etc/orchestrator/tenants/app-frontend/ssl/privkey.pem
      client_auth: none          # none | optional | required
      min_version: "1.2"         # "1.2" | "1.3"
      alpn: ["h2", "http/1.1"]

# ---------------------------------------------------------------------------
# Upstream behaviour and health checks
# ---------------------------------------------------------------------------
upstream:
  connect_timeout: 2s
  response_timeout: 30s
  idle_timeout: 60s
  max_connections_per_endpoint: 1024
  retries: 1
  health_check:
    type: http                 # http | tcp
    path: /healthz
    interval: 10s
    timeout: 2s
    healthy_threshold: 2
    unhealthy_threshold: 3

# ---------------------------------------------------------------------------
# Routing hierarchy: region -> datacenter -> cluster -> endpoint
# ---------------------------------------------------------------------------
hierarchy:
  regions:
    - name: us-east
      weight: 60
      datacenters:
        - name: dc-1
          weight: 100
          clusters:
            - name: prod
              weight: 100
              endpoints:
                - name: ep-a
                  weight: 60
                  address: 10.1.1.5:8080
                - name: ep-b
                  weight: 40
                  address: 10.1.1.6:8080
            - name: prod-green
              weight: 0
              endpoints:
                - name: ep-green
                  weight: 100
                  address: 10.1.1.7:8080
    - name: eu-west
      weight: 40
      datacenters:
        - name: dc-2
          weight: 100
          clusters:
            - name: prod
              weight: 100
              endpoints:
                - name: ep-c
                  weight: 100
                  address: 10.2.1.5:8080

# ---------------------------------------------------------------------------
# Routes
# ---------------------------------------------------------------------------
routes:
  - name: api-v2
    enabled: true
    match:
      path: /api/v2
      type: prefix             # prefix | exact
    scope:
      region: "*"              # "*" = any region
    affinity:
      method: cookie           # none | cookie | header | client-ip
      cookie_name: ORCHSID
      ttl: 30m

  - name: health
    enabled: true
    match:
      path: /health
      type: exact
    affinity:
      method: none

# ---------------------------------------------------------------------------
# Blue/green rollout
# ---------------------------------------------------------------------------
rollout:
  route: api-v2
  strategy: blue-green         # blue-green | canary
  blue:
    region: us-east
    datacenter: dc-1
    cluster: prod
  green:
    region: us-east
    datacenter: dc-1
    cluster: prod-green
  steps: [0, 25, 50, 75, 100]
  step_duration: 5m
  mode: gradual                # gradual | instant | manual
  auto_rollback:
    enabled: true
    error_rate_threshold: 0.05
    latency_p99_threshold: 2s
    window: 1m
    min_samples: 100
  notify:
    webhook: https://hooks.internal/orchestrator
    events: [rollback, complete, failed]

# ---------------------------------------------------------------------------
# DNS
# ---------------------------------------------------------------------------
dns:
  enabled: true
  listen: 0.0.0.0:53
  upstream:
    - 1.1.1.1
    - 8.8.8.8
  ttl: 60
  records:
    - name: api
      type: A
      value: 10.0.0.100
      ttl: 30
    - name: _http._api
      type: SRV
      priority: 10
      weight: 10
      port: 443
      target: api.app-frontend.internal

# ---------------------------------------------------------------------------
# Observability
# ---------------------------------------------------------------------------
metrics:
  enabled: true
  bind: 127.0.0.1:9090

logging:
  level: info                  # error | warn | info | debug | trace
  format: json                 # json | compact

# ---------------------------------------------------------------------------
# Worker identity and HA
# ---------------------------------------------------------------------------
worker:
  mode: active-passive         # active-passive | active-active
  node_id: worker-a
  sync:
    listen: 0.0.0.0:9091
    peer: 10.0.2.11:9091
    heartbeat_interval: 300ms
    peer_timeout: 1s
